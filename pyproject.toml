[project]
name = "odata-query"
version = "0.10.1"
description = "An OData query parser and transpiler."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oliver Hofkens", email = "oliver@gorilla.co" }]
keywords = ["OData", "Query", "Parser"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Compilers",
]
requires-python = ">=3.11"
dependencies = [
    "python-dateutil>=2.8.1",
    "sly>=0.4,<0.5",
]

[project.optional-dependencies]
django = ["django>=5.2"]
sqlalchemy = ["sqlalchemy>=1.4,<2"]

[dependency-groups]
test = [
    "odata-query[django,sqlalchemy]",
    "pytest>=7",
    "pytest-cov",
]
docs = [
    "odata-query[django,sqlalchemy]",
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
]
lint = [
    "odata-query[django,sqlalchemy]",
    "ruff",
    "ty",
    "types-python-dateutil",
]
release = ["bump2version>=1"]
dev = [
    "poethepoet",
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "release" },
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""

[tool.poe.tasks]
test = { cmd = "pytest tests/unit tests/integration -r fEs", env = { DJANGO_SETTINGS_MODULE = "tests.integration.django.settings" } }
lint = [
    { cmd = "ruff check" },
    { cmd = "ruff format --check" },
    { cmd = "ty check" },
]
format = [
    { cmd = "ruff check --select I --fix" },
    { cmd = "ruff format" },
]
docs = "sphinx-build docs/source docs/build"
apidoc = "sphinx-apidoc -f -o docs/source/api -e odata_query"

[tool.pytest.ini_options]
addopts = "--cov . --cov-branch --cov-report term-missing --cov-report xml:coverage.xml"
testpaths = ["tests"]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
omit = ["tests/*", ".venv/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"odata_query/grammar.py" = ["F821", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["odata_query", "tests"]
combine-as-imports = true

[tool.ty.src]
include = ["odata_query"]

[tool.ty.analysis]
replace-imports-with-any = ["django.**", "sqlalchemy.**"]

[[tool.ty.overrides]]
include = ["odata_query/grammar.py"]

[tool.ty.overrides.rules]
# SLY injects `_` into the class namespace.
unresolved-reference = "ignore"
