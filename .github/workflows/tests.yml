name: Run tests & docs

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
        django: ['>=5.2,<5.3', '>=6,<7']
        exclude:
          # Django 6 requires Python 3.12+
          - python-version: '3.11'
            django: '>=6,<7'

    steps:
      - uses: actions/checkout@v4
      - name: Install GIS libraries
        run: sudo apt-get install -y binutils libproj-dev gdal-bin libsqlite3-mod-spatialite
      - uses: astral-sh/setup-uv@v6
      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }}
          uv pip install "django${{ matrix.django }}"
      - name: Run tests
        run: uv run --no-sync poe test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build docs
        run: uv run poe docs
